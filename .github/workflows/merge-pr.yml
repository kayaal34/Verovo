name: merge-pr

# One-shot helper: create the PR for this branch and merge it with GITHUB_TOKEN
# once the branch checks are clean. Safe to delete after the merge.
on:
  push:
    branches: [seo/buyer-review-links]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Create PR if missing, wait for checks, squash-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = "roy-tong/Verovo"
          head = "seo/buyer-review-links"
          title = "Example: give the buyer-review report outbound navigation"
          body = ("OpenSEO flagged the synthetic buyer-review report as having no outgoing links. "
                  "Add a footer back to the site, free runs and the claims index.")

          def api(method, path, data=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}", method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "merge-pr"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  print("HTTP", exc.code, exc.read().decode()[:400])
                  raise

          prs = api("GET", f"/pulls?head=roy-tong:{head}&state=open")
          pr = prs[0] if prs else api("POST", "/pulls", {"title": title, "head": head, "base": "main", "body": body})
          print("PR", pr["number"], pr["html_url"], flush=True)
          for _ in range(50):
              p = api("GET", f"/pulls/{pr['number']}")
              print("state", p.get("mergeable_state"), flush=True)
              if p.get("mergeable_state") == "clean":
                  print(api("PUT", f"/pulls/{pr['number']}/merge", {"merge_method": "squash"}), flush=True)
                  break
              time.sleep(15)
          else:
              print("not merged; state", p.get("mergeable_state"), flush=True)
          PY
